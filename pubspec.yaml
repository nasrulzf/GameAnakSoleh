name: game_anak_soleh
description: "Game edukasi Islami 2D ala platformer untuk anak usia 3-7 tahun."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_audio: ^2.10.7
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  auto_size_text: ^3.0.0
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#8FD3F4"
  image: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#8FD3F4"
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/bg/
    - assets/images/ground/
    - assets/images/platform/
    - assets/images/obstacle/
    - assets/images/characters/
    - assets/images/buildings/
    - assets/images/items/
    - assets/images/scenery/
    - assets/sounds/sfx/
    - assets/sounds/music/
