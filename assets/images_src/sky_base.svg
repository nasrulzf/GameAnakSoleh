<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EC6FF"/>
      <stop offset="55%" stop-color="#9BDCFF"/>
      <stop offset="100%" stop-color="#CFF2FF"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="60%" stop-color="#FFEB77"/>
      <stop offset="100%" stop-color="#FFEB77" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="1350" cy="150" r="180" fill="url(#sunGlow)"/>
  <circle cx="1350" cy="150" r="80" fill="#FFE066" stroke="#FFC93C" stroke-width="6"/>
</svg>
