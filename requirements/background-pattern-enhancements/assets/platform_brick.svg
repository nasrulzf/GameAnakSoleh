<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0855B"/>
      <stop offset="100%" stop-color="#D9613C"/>
    </linearGradient>
  </defs>

  <!-- base block with thick friendly outline -->
  <rect x="6" y="6" width="188" height="88" rx="18" fill="url(#brickGrad)" stroke="#7A331B" stroke-width="8"/>

  <!-- top highlight -->
  <rect x="16" y="14" width="168" height="18" rx="9" fill="#FFC29A" opacity="0.55"/>

  <!-- brick lines (row 1) -->
  <g stroke="#7A331B" stroke-width="6" stroke-linecap="round">
    <line x1="6" y1="38" x2="194" y2="38"/>
    <line x1="6" y1="66" x2="194" y2="66"/>
    <!-- vertical offsets, staggered like real bricks -->
    <line x1="50" y1="6" x2="50" y2="38"/>
    <line x1="110" y1="6" x2="110" y2="38"/>
    <line x1="160" y1="6" x2="160" y2="38"/>

    <line x1="30" y1="38" x2="30" y2="66"/>
    <line x1="90" y1="38" x2="90" y2="66"/>
    <line x1="150" y1="38" x2="150" y2="66"/>

    <line x1="50" y1="66" x2="50" y2="94"/>
    <line x1="110" y1="66" x2="110" y2="94"/>
    <line x1="160" y1="66" x2="160" y2="94"/>
  </g>

  <!-- cute little sparkle -->
  <g fill="#FFF3C4">
    <circle cx="40" cy="50" r="4"/>
    <circle cx="145" cy="80" r="3"/>
  </g>
</svg>
