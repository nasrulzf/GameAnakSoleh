<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EC6FF"/>
      <stop offset="55%" stop-color="#9BDCFF"/>
      <stop offset="100%" stop-color="#CFF2FF"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="60%" stop-color="#FFEB77"/>
      <stop offset="100%" stop-color="#FFEB77" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="1350" cy="150" r="180" fill="url(#sunGlow)"/>
  <circle cx="1350" cy="150" r="80" fill="#FFE066" stroke="#FFC93C" stroke-width="6"/>

  <!-- Distant small clouds (parallax layer) -->
  <g opacity="0.6">
    <g transform="translate(120,120)">
      <ellipse cx="0" cy="20" rx="60" ry="26" fill="#FFFFFF"/>
      <ellipse cx="40" cy="10" rx="45" ry="30" fill="#FFFFFF"/>
      <ellipse cx="-40" cy="14" rx="40" ry="24" fill="#FFFFFF"/>
    </g>
    <g transform="translate(900,90)">
      <ellipse cx="0" cy="20" rx="55" ry="22" fill="#FFFFFF"/>
      <ellipse cx="35" cy="10" rx="38" ry="26" fill="#FFFFFF"/>
      <ellipse cx="-35" cy="12" rx="34" ry="20" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Cute puffy cloud 1 -->
  <g transform="translate(260,220)">
    <ellipse cx="0" cy="55" rx="130" ry="55" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <circle cx="-80" cy="30" r="55" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <circle cx="0" cy="0" r="75" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <circle cx="90" cy="25" r="60" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <ellipse cx="0" cy="55" rx="130" ry="55" fill="#FFFFFF"/>
  </g>

  <!-- Cute puffy cloud 2 (with smiling face) -->
  <g transform="translate(680,340)">
    <ellipse cx="0" cy="50" rx="110" ry="48" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <circle cx="-70" cy="25" r="48" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <circle cx="10" cy="-5" r="62" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <circle cx="80" cy="20" r="50" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <ellipse cx="0" cy="50" rx="110" ry="48" fill="#FFFFFF"/>
    <!-- face -->
    <circle cx="-20" cy="10" r="6" fill="#5A5A5A"/>
    <circle cx="20" cy="10" r="6" fill="#5A5A5A"/>
    <path d="M -18 26 Q 0 42 18 26" stroke="#5A5A5A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="-30" cy="24" r="10" fill="#FFB6C1" opacity="0.7"/>
    <circle cx="30" cy="24" r="10" fill="#FFB6C1" opacity="0.7"/>
  </g>

  <!-- Cute puffy cloud 3 -->
  <g transform="translate(1120,250)">
    <ellipse cx="0" cy="45" rx="95" ry="42" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <circle cx="-60" cy="22" r="42" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <circle cx="10" cy="-5" r="55" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <circle cx="70" cy="18" r="44" fill="#FFFFFF" stroke="#BFE3F5" stroke-width="6"/>
    <ellipse cx="0" cy="45" rx="95" ry="42" fill="#FFFFFF"/>
  </g>

  <!-- Small birds -->
  <g stroke="#5A7DA0" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M 500 130 q 15 -18 30 0 q 15 -18 30 0"/>
    <path d="M 560 170 q 12 -14 24 0 q 12 -14 24 0"/>
  </g>
</svg>
