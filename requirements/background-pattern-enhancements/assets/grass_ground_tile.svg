<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="dirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C68B4B"/>
      <stop offset="100%" stop-color="#A46A34"/>
    </linearGradient>
  </defs>

  <!-- Dirt base (bottom layer, tiles seamlessly left-right and downward) -->
  <rect x="0" y="55" width="200" height="145" fill="url(#dirtGrad)"/>
  <!-- little dirt dots for texture -->
  <g fill="#8F5A29" opacity="0.5">
    <circle cx="30" cy="100" r="5"/>
    <circle cx="90" cy="140" r="6"/>
    <circle cx="150" cy="90" r="4"/>
    <circle cx="170" cy="160" r="5"/>
    <circle cx="55" cy="170" r="4"/>
  </g>

  <!-- Grass top layer -->
  <rect x="0" y="0" width="200" height="60" fill="#6DD24C"/>
  <rect x="0" y="0" width="200" height="18" fill="#8AE86A"/>

  <!-- Grass tufts along the top edge -->
  <g fill="#4FAF37">
    <path d="M0,18 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 q6,-18 12,0 L200,18 L200,30 L0,30 Z"/>
  </g>

  <!-- small flowers -->
  <g>
    <g transform="translate(45,42)">
      <circle r="4" fill="#FFF176"/>
      <circle cx="-7" r="4" fill="#FFFFFF"/>
      <circle cx="7" r="4" fill="#FFFFFF"/>
      <circle cy="-7" r="4" fill="#FFFFFF"/>
      <circle cy="7" r="4" fill="#FFFFFF"/>
    </g>
    <g transform="translate(150,35)">
      <circle r="3.5" fill="#FFF176"/>
      <circle cx="-6" r="3.5" fill="#FFFFFF"/>
      <circle cx="6" r="3.5" fill="#FFFFFF"/>
      <circle cy="-6" r="3.5" fill="#FFFFFF"/>
      <circle cy="6" r="3.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- outline so tile reads clearly as a block when placed -->
  <rect x="1.5" y="1.5" width="197" height="197" fill="none" stroke="#3E8E2E" stroke-width="0" />
</svg>
