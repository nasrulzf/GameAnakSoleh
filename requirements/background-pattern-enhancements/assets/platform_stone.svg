<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9C4CC"/>
      <stop offset="100%" stop-color="#8E9BA6"/>
    </linearGradient>
  </defs>

  <!-- base rounded platform slab -->
  <rect x="6" y="16" width="188" height="78" rx="24" fill="url(#stoneGrad)" stroke="#5C6670" stroke-width="8"/>

  <!-- clustered rounded stones on top edge -->
  <g stroke="#5C6670" stroke-width="6">
    <ellipse cx="35" cy="20" rx="26" ry="16" fill="#C7D1D8"/>
    <ellipse cx="80" cy="14" rx="30" ry="18" fill="#A8B4BD"/>
    <ellipse cx="128" cy="18" rx="27" ry="16" fill="#C7D1D8"/>
    <ellipse cx="170" cy="22" rx="24" ry="15" fill="#A8B4BD"/>
  </g>

  <!-- moss tufts on top -->
  <g fill="#7BC26B">
    <ellipse cx="60" cy="4" rx="14" ry="7"/>
    <ellipse cx="110" cy="2" rx="12" ry="6"/>
    <ellipse cx="150" cy="6" rx="10" ry="5"/>
  </g>

  <!-- shading dots for texture -->
  <g fill="#5C6670" opacity="0.35">
    <circle cx="50" cy="55" r="4"/>
    <circle cx="100" cy="70" r="5"/>
    <circle cx="150" cy="50" r="4"/>
    <circle cx="170" cy="75" r="3.5"/>
  </g>

  <!-- top highlight for glossy friendly look -->
  <ellipse cx="70" cy="35" rx="60" ry="10" fill="#FFFFFF" opacity="0.25"/>
</svg>
